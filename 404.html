<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6eb162">
    <meta name="robots" content="noindex">
    <title>Page not found | Basic Website Template</title>
    <link rel="icon" type="image/svg+xml" href="/basic-website-template/favicon.svg?v=grid-green">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: #000000; background: #ffffff; font-family: Georgia, 'Times New Roman', serif; }
      header { margin-top: calc(24px + env(safe-area-inset-top, 0px)); background: #fafbfa; border-bottom: 1px solid #e5e7e5; padding: 22px 32px; }
      a { color: #000000; text-underline-offset: 4px; }
      a:focus-visible { outline: 3px solid #3d712f; outline-offset: 5px; }
      main { flex: 1; width: min(1440px, calc(100% - 64px)); margin: 0 auto; padding: 76px 0 96px; }
      .error-code { margin: 0 0 24px; font-size: 16px; }
      h1 { margin: 0 0 24px; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(36px, 6vw, 52px); font-weight: 400; line-height: 1.14; }
      p { font-size: 18px; line-height: 1.8; }
      .home-link { display: inline-block; margin-top: 16px; padding: 14px 20px; background: #6eb162; border-bottom: 3px solid #3d712f; }
      footer { padding: 24px 32px; background: #fafbfa; border-top: 1px solid #e5e7e5; font-size: 14px; line-height: 1.6; }
      @media (max-width: 600px) { main { width: calc(100% - 48px); padding: 48px 0 64px; } header, footer { padding-left: 24px; padding-right: 24px; } }
    </style>
  </head>
  <body>
    <header><a href="/basic-website-template/">Section Home</a></header>
    <main>
      <p class="error-code">404</p>
      <h1>Page not found</h1>
      <p>This page may have moved, or the address may be incorrect.</p>
      <a class="home-link" href="/basic-website-template/">Return to Section Home</a>
    </main>
    <footer>© <span id="year">2026</span> Your Name or Organization</footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
